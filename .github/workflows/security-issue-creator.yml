name: "Create Security Issues from Scan Results"

on:
  workflow_run:
    workflows: ["CodeQL Scan"]
    types:
      - completed
  schedule:
    # Run daily at 2 AM UTC to check for new security alerts
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Allow manual trigger

permissions:
  contents: read
  issues: write
  security-events: read

jobs:
  create-security-issues:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      - name: "Check out repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: "Set up Node.js"
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af #v4.1.0
        with:
          node-version: '20'

      - name: "Create script for processing security alerts"
        run: |
          cat > process-security-alerts.js << 'EOF'
          const https = require('https');
          const fs = require('fs');

          const owner = process.env.GITHUB_REPOSITORY.split('/')[0];
          const repo = process.env.GITHUB_REPOSITORY.split('/')[1];
          const token = process.env.GITHUB_TOKEN;

          // Helper function to make GitHub API requests
          function makeGitHubRequest(path, method = 'GET', data = null) {
            return new Promise((resolve, reject) => {
              const options = {
                hostname: 'api.github.com',
                path: path,
                method: method,
                headers: {
                  'Authorization': `Bearer ${token}`,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'Security-Issue-Creator',
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              };

              if (data) {
                options.headers['Content-Type'] = 'application/json';
              }

              const req = https.request(options, (res) => {
                let responseData = '';
                res.on('data', (chunk) => {
                  responseData += chunk;
                });
                res.on('end', () => {
                  if (res.statusCode >= 200 && res.statusCode < 300) {
                    resolve(JSON.parse(responseData || '{}'));
                  } else {
                    console.error(`API Error: ${res.statusCode} - ${responseData}`);
                    reject(new Error(`GitHub API returned ${res.statusCode}: ${responseData}`));
                  }
                });
              });

              req.on('error', reject);
              
              if (data) {
                req.write(JSON.stringify(data));
              }
              
              req.end();
            });
          }

          // Get code scanning alerts
          async function getCodeScanningAlerts() {
            try {
              const alerts = await makeGitHubRequest(`/repos/${owner}/${repo}/code-scanning/alerts?state=open&per_page=100`);
              return alerts;
            } catch (error) {
              console.log('Code scanning alerts not accessible or not available:', error.message);
              return [];
            }
          }

          // Get secret scanning alerts
          async function getSecretScanningAlerts() {
            try {
              const alerts = await makeGitHubRequest(`/repos/${owner}/${repo}/secret-scanning/alerts?state=open&per_page=100`);
              return alerts;
            } catch (error) {
              console.log('Secret scanning alerts not accessible or not available:', error.message);
              return [];
            }
          }

          // Get existing issues
          async function getExistingIssues() {
            try {
              const issues = await makeGitHubRequest(`/repos/${owner}/${repo}/issues?labels=security-finding&state=open&per_page=100`);
              return issues;
            } catch (error) {
              console.error('Failed to get existing issues:', error.message);
              return [];
            }
          }

          // Create an issue
          async function createIssue(title, body, labels) {
            try {
              const issue = await makeGitHubRequest(
                `/repos/${owner}/${repo}/issues`,
                'POST',
                {
                  title: title,
                  body: body,
                  labels: labels,
                  assignees: ['copilot']
                }
              );
              console.log(`Created issue #${issue.number}: ${title}`);
              return issue;
            } catch (error) {
              console.error(`Failed to create issue "${title}":`, error.message);
              // Try without assignee if copilot assignment fails
              try {
                const issue = await makeGitHubRequest(
                  `/repos/${owner}/${repo}/issues`,
                  'POST',
                  {
                    title: title,
                    body: body,
                    labels: labels
                  }
                );
                console.log(`Created issue #${issue.number} without assignee: ${title}`);
                return issue;
              } catch (retryError) {
                console.error(`Failed to create issue even without assignee:`, retryError.message);
                return null;
              }
            }
          }

          // Process code scanning alerts
          async function processCodeScanningAlerts(alerts, existingIssues) {
            const existingTitles = new Set(existingIssues.map(i => i.title));
            let created = 0;

            for (const alert of alerts) {
              const title = `[Security] ${alert.rule.security_severity_level || 'medium'}: ${alert.rule.description} (CodeQL Alert #${alert.number})`;
              
              // Skip if issue already exists
              if (existingTitles.has(title)) {
                console.log(`Issue already exists: ${title}`);
                continue;
              }

              const body = `## Security Finding from CodeQL

          **Alert ID:** ${alert.number}
          **Rule:** ${alert.rule.id}
          **Severity:** ${alert.rule.security_severity_level || 'medium'}
          **State:** ${alert.state}

          ### Description
          ${alert.rule.description}

          ${alert.rule.help ? `### Help\n${alert.rule.help}\n` : ''}

          ### Location
          - **File:** \`${alert.most_recent_instance?.location?.path || 'N/A'}\`
          - **Line:** ${alert.most_recent_instance?.location?.start_line || 'N/A'}

          ### Alert URL
          ${alert.html_url}

          ---
          *This issue was automatically created from a CodeQL security scan finding.*
          *Please review and address this security concern.*`;

              const labels = ['security-finding', 'automated', alert.rule.security_severity_level || 'medium'];
              
              const issue = await createIssue(title, body, labels);
              if (issue) {
                created++;
                // Rate limit: wait 1 second between creations
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
            }

            return created;
          }

          // Process secret scanning alerts
          async function processSecretScanningAlerts(alerts, existingIssues) {
            const existingTitles = new Set(existingIssues.map(i => i.title));
            let created = 0;

            for (const alert of alerts) {
              const title = `[Security] Secret detected: ${alert.secret_type} (Secret Alert #${alert.number})`;
              
              // Skip if issue already exists
              if (existingTitles.has(title)) {
                console.log(`Issue already exists: ${title}`);
                continue;
              }

              const body = `## Security Finding from Secret Scanning

          **Alert ID:** ${alert.number}
          **Secret Type:** ${alert.secret_type}
          **State:** ${alert.state}

          ### Description
          A secret of type "${alert.secret_type}" has been detected in the repository.

          ${alert.push_protection_bypassed ? '⚠️ **Push protection was bypassed for this secret.**\n' : ''}

          ### Location
          ${alert.locations && alert.locations.length > 0 ? alert.locations.map(loc => 
            `- **File:** \`${loc.details?.path || 'N/A'}\`\n  **Line:** ${loc.details?.start_line || 'N/A'}`
          ).join('\n') : '- Location information not available'}

          ### Alert URL
          ${alert.html_url}

          ### Recommended Action
          1. Rotate the exposed secret immediately
          2. Review access logs for any unauthorized usage
          3. Remove the secret from the repository history
          4. Update the application to use the new secret

          ---
          *This issue was automatically created from a secret scanning finding.*
          *This is a critical security concern and should be addressed immediately.*`;

              const labels = ['security-finding', 'automated', 'critical', 'secret-exposed'];
              
              const issue = await createIssue(title, body, labels);
              if (issue) {
                created++;
                // Rate limit: wait 1 second between creations
                await new Promise(resolve => setTimeout(resolve, 1000));
              }
            }

            return created;
          }

          // Main function
          async function main() {
            console.log(`Processing security alerts for ${owner}/${repo}...`);
            
            try {
              // Get all alerts and existing issues
              console.log('Fetching security alerts...');
              const [codeScanningAlerts, secretScanningAlerts, existingIssues] = await Promise.all([
                getCodeScanningAlerts(),
                getSecretScanningAlerts(),
                getExistingIssues()
              ]);

              console.log(`Found ${codeScanningAlerts.length} code scanning alerts`);
              console.log(`Found ${secretScanningAlerts.length} secret scanning alerts`);
              console.log(`Found ${existingIssues.length} existing security issues`);

              // Process alerts
              console.log('\nProcessing code scanning alerts...');
              const codeIssuesCreated = await processCodeScanningAlerts(codeScanningAlerts, existingIssues);
              
              console.log('\nProcessing secret scanning alerts...');
              const secretIssuesCreated = await processSecretScanningAlerts(secretScanningAlerts, existingIssues);

              console.log(`\n✅ Complete! Created ${codeIssuesCreated + secretIssuesCreated} new security issues.`);
              console.log(`   - Code scanning: ${codeIssuesCreated} issues`);
              console.log(`   - Secret scanning: ${secretIssuesCreated} issues`);

            } catch (error) {
              console.error('Error processing security alerts:', error);
              process.exit(1);
            }
          }

          main();
          EOF

      - name: "Process security alerts and create issues"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node process-security-alerts.js
